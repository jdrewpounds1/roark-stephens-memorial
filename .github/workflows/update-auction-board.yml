name: Update auction bid board

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction-board-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build verified public bid board
        env:
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
        run: node scripts/update-auction-bids.mjs
      - name: Publish changed bid totals
        run: |
          if git diff --quiet -- auction-bids.json; then
            echo "No new valid bids"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auction-bids.json
          git commit -m "Update verified auction bid board"
          git push
